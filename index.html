<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>صفحه پرداخت</title>

  <style>
    @font-face{
      font-family:'Yekan';
      src:
        url('./assets/fonts/Yekan.woff2') format('woff2'),
        url('./assets/fonts/Yekan.woff') format('woff');
      font-display:swap;
      font-weight:normal;
      font-style:normal;
    }

    :root{
      --font-main:'Yekan','IRANYekan','YekanBakh','Vazirmatn',Tahoma,Arial,sans-serif;
      --r-xl:20px; --r-lg:14px; --r-md:10px; --tr:.22s ease;
    }

    html[data-theme="dark"]{
      --bg1:#0a1020;--bg2:#121a2d;--text:#e5e7eb;--muted:#94a3b8;--card:#0f172acc;--card-b:#3341558c;--soft:#11182799;--chip:#111827;
      --bar-bg:#3f0b0b;--bar-fill1:#ef4444;--bar-fill2:#f87171;--sk:#1f2937;
      --cardbox-bg:#0b254a;--cardbox-b:#1d4ed8;--cardbox-text:#dbeafe;--copy-bg:#1e40af;--copy-bg-hover:#1d4ed8;--copy-text:#eff6ff;
      --final-bg:linear-gradient(135deg,#052e16,#14532d);--final-text:#ecfccb;--final-k:#bbf7d0;--tap-bg:#1e3a8a;
    }

    html[data-theme="light"]{
      --bg1:#fffdf8;--bg2:#f7f2e9;--text:#1f2937;--muted:#6b7280;--card:#fffefbdd;--card-b:#e8ddcc;--soft:#fffaf0;--chip:#ffffff;
      --bar-bg:#fee2e2;--bar-fill1:#ef4444;--bar-fill2:#f87171;--sk:#ece7de;
      --cardbox-bg:#f8fbff;--cardbox-b:#dbeafe;--cardbox-text:#1e3a8a;--copy-bg:#2563eb;--copy-bg-hover:#1d4ed8;--copy-text:#ffffff;
      --final-bg:linear-gradient(135deg,#ecfdf3,#dcfce7);--final-text:#14532d;--final-k:#166534;--tap-bg:#eff6ff;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;font-family:var(--font-main)!important}
    body{
      margin:0;color:var(--text);
      background:
        radial-gradient(1000px 600px at 100% -10%, #f59e0b14 0%, transparent 60%),
        radial-gradient(900px 540px at -10% 120%, #3b82f614 0%, transparent 60%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex;align-items:center;justify-content:center;padding:18px;
      transition:background var(--tr),color var(--tr);
    }

    .wrap{width:100%;max-width:720px}
    .card{
      background:var(--card);border:1px solid var(--card-b);border-radius:var(--r-xl);
      backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(2,6,23,.14);
      overflow:hidden;animation:fadeIn .35s ease
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

    .top{padding:14px;border-bottom:1px solid var(--card-b);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .title{display:flex;flex-direction:column;gap:4px}
    .title h1{margin:0;font-size:20px;font-weight:900}
    .title p{margin:0;font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:8px}

    .icon-btn{
      border:1px solid var(--card-b);background:var(--chip);color:var(--text);
      border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;
    }
    .icon-btn svg{width:18px;height:18px}

    .content{padding:16px;display:grid;gap:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mini{background:var(--soft);border:1px solid var(--card-b);border-radius:var(--r-lg);padding:10px 12px}
    .mini .k{font-size:11px;color:var(--muted);margin-bottom:4px}
    .mini .v{font-size:22px;font-weight:900;line-height:1.25}
    .mini .u{font-size:11px;color:var(--muted)}

    .final{
      border:1px solid #22c55e44;background:var(--final-bg);color:var(--final-text);
      border-radius:var(--r-lg);padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .final .k{font-size:12px;color:var(--final-k)}
    .final .v{font-size:30px;font-weight:900;line-height:1.1}

    .valid{border:1px solid #ef444466;border-radius:var(--r-md);padding:10px;background:color-mix(in srgb, var(--bar-bg) 40%, transparent)}
    .valid-top{display:flex;justify-content:space-between;font-size:12px;color:#b91c1c;margin-bottom:8px}
    .bar{height:8px;border-radius:999px;overflow:hidden;background:var(--bar-bg);border:1px solid #fecaca}
    .bar > span{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bar-fill1),var(--bar-fill2));transition:width 1s linear}

    .meta{
      font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;
      border:1px solid var(--card-b);border-radius:var(--r-md);padding:10px;background:var(--soft)
    }

    .err{display:none;font-size:12px;color:#b91c1c;background:#fee2e2;border:1px solid #fecaca;border-radius:10px;padding:10px}
    .err.show{display:block}

    .cardbox{
      border:1px solid var(--cardbox-b);background:var(--cardbox-bg);color:var(--cardbox-text);
      border-radius:12px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    }
    .owner{
      font-size:13px;font-weight:800;background:var(--tap-bg);border:1px dashed var(--cardbox-b);
      padding:6px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;
    }
    .num{font-size:20px;font-weight:900;letter-spacing:1px;direction:ltr;unicode-bidi:plaintext;white-space:nowrap}
    .card-tap{cursor:pointer;padding:8px 10px;border-radius:10px;border:1px dashed var(--cardbox-b);background:var(--tap-bg)}

    .copy-btn{
      border:none;border-radius:10px;padding:8px 12px;cursor:pointer;background:var(--copy-bg);color:var(--copy-text);
      font-weight:800;font-size:12px;min-height:38px;
    }

    .skeleton{position:relative;color:transparent!important;user-select:none}
    .skeleton::after{
      content:"";position:absolute;inset:0;border-radius:8px;
      background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.35) 35%, transparent 70%), var(--sk);
      background-size:220% 100%, 100% 100%;animation:shimmer 1.2s linear infinite
    }
    @keyframes shimmer{from{background-position:220% 0,0 0}to{background-position:-20% 0,0 0}}

    .footer{text-align:center;font-size:11px;color:var(--muted);padding-top:2px}
    @media (max-width:640px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" id="captureArea">
      <header class="top">
        <div class="title">
          <h1>صفحه پرداخت</h1>
          <p>نمایش خلاصه و شفاف برای پرداخت سریع</p>
        </div>
        <div class="actions">
          <button id="pngBtn" class="icon-btn" type="button" title="دانلود PNG" aria-label="دانلود PNG">⬇️</button>
          <button id="themeToggle" class="icon-btn" type="button" title="تغییر تم" aria-label="تغییر تم">🌓</button>
        </div>
      </header>

      <div class="content">
        <section class="row">
          <article class="mini">
            <div class="k">مبلغ سفارش</div>
            <div id="usdAmount" class="v">25</div>
            <div class="u">دلار</div>
          </article>
          <article class="mini">
            <div class="k">نرخ دلار</div>
            <div id="usdRate" class="v skeleton">000000</div>
            <div class="u">ریال</div>
          </article>
        </section>

        <section class="final">
          <div>
            <div class="k">مبلغ نهایی قابل پرداخت</div>
            <div id="finalAmount" class="v skeleton">000000</div>
          </div>
          <button id="copyAmountBtn" class="copy-btn" type="button">کپی مبلغ</button>
        </section>

        <section class="valid">
          <div class="valid-top">
            <span>اعتبار نرخ امروز</span>
            <span id="countdownText">—</span>
          </div>
          <div class="bar"><span id="countdownBar"></span></div>
        </section>

        <section class="meta">
          <span>بروزرسانی: <strong id="updatedAt">—</strong></span>
          <span>منبع: <strong id="sourceName">TGJU</strong></span>
        </section>

        <div id="errorBox" class="err"></div>

        <section class="cardbox">
          <div>
            <div class="label">شماره کارت بلوبانک (کارت‌به‌کارت)</div>
            <div class="owner">👤 سیدمحمدمهدی کشاورز</div>
            <div id="cardTapArea" class="card-tap" title="برای کپی شماره کارت تپ کنید">
              <div id="cardNumber" class="num">6219861981093916</div>
            </div>
          </div>
          <button id="copyCardBtn" class="copy-btn" type="button">کپی شماره کارت</button>
        </section>

        <div class="footer">فعلاً پرداخت فقط از طریق کارت‌به‌کارت انجام می‌شود.</div>
      </div>
    </section>
  </main>

  <script>
    const DEFAULT_FIXED_USD = 25;
    const IRAN_TZ = 'Asia/Tehran';
    const IRAN_OFFSET_MIN = 210;
    const DAY_MS = 24 * 60 * 60 * 1000;

    const usdAmountEl = document.getElementById('usdAmount');
    const usdRateEl = document.getElementById('usdRate');
    const finalAmountEl = document.getElementById('finalAmount');
    const copyAmountBtnEl = document.getElementById('copyAmountBtn');
    const updatedAtEl = document.getElementById('updatedAt');
    const sourceNameEl = document.getElementById('sourceName');
    const countdownTextEl = document.getElementById('countdownText');
    const countdownBarEl = document.getElementById('countdownBar');
    const errorBoxEl = document.getElementById('errorBox');
    const themeToggleEl = document.getElementById('themeToggle');
    const pngBtnEl = document.getElementById('pngBtn');
    const captureAreaEl = document.getElementById('captureArea');
    const copyCardBtnEl = document.getElementById('copyCardBtn');
    const cardNumberEl = document.getElementById('cardNumber');
    const cardTapAreaEl = document.getElementById('cardTapArea');

    const nf = new Intl.NumberFormat('fa-IR');
    const fmt = n => nf.format(Math.floor(n || 0));

    let dayStartMs = null, dayEndMs = null, countdownTimer = null;
    let fixedUsd = DEFAULT_FIXED_USD, currentFinalIrr = 0, midnightRefreshDone = false;

    function formatCardNumber(raw){
      const digits = String(raw || '').replace(/\D/g, '').slice(0,16);
      return digits.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
    }

    function getRawCardNumber(){ return (cardNumberEl.textContent || '').replace(/\D/g,'').slice(0,16); }

    function formatJalaliDate(value){
      if(!value) return 'نامشخص';
      const d = new Date(value);
      if(Number.isNaN(d.getTime())) return value;
      return new Intl.DateTimeFormat('fa-IR-u-ca-persian',{
        year:'numeric',month:'2-digit',day:'2-digit',
        hour:'2-digit',minute:'2-digit',second:'2-digit',
        hourCycle:'h23',timeZone: IRAN_TZ
      }).format(d);
    }

    async function copyCardRaw(){
      const card = getRawCardNumber();
      if(!card || card.length < 16) return showError('شماره کارت نامعتبر است.');
      try{
        await navigator.clipboard.writeText(card);
        const old = copyCardBtnEl.textContent; copyCardBtnEl.textContent = 'کپی شد ✅';
        setTimeout(()=>copyCardBtnEl.textContent = old, 1200);
      }catch{
        const old = copyCardBtnEl.textContent; copyCardBtnEl.textContent = 'کپی نشد ❌';
        setTimeout(()=>copyCardBtnEl.textContent = old, 1200);
      }
    }

    function applyTheme(theme){ document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('theme', theme); }
    function initTheme(){ const saved = localStorage.getItem('theme'); applyTheme(saved === 'dark' ? 'dark' : 'light'); }

    themeToggleEl.addEventListener('click', () => {
      const now = document.documentElement.getAttribute('data-theme');
      applyTheme(now === 'dark' ? 'light' : 'dark');
    });

    function showError(msg){ errorBoxEl.textContent = msg; errorBoxEl.classList.add('show'); }
    function hideError(){ errorBoxEl.classList.remove('show'); errorBoxEl.textContent = ''; }
    function setLoading(on){ [usdRateEl, finalAmountEl].forEach(el => el.classList.toggle('skeleton', on)); }
    function calcSmartFinal(exact){ return Math.floor(exact / 10000) * 10000 + 900; }

    function getTehranYMDParts(ms){
      const parts = new Intl.DateTimeFormat('en-CA',{timeZone: IRAN_TZ, year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date(ms));
      return {
        y: Number(parts.find(p => p.type === 'year')?.value),
        m: Number(parts.find(p => p.type === 'month')?.value),
        d: Number(parts.find(p => p.type === 'day')?.value),
      };
    }

    function tehranMidnightUtcMs(y,m,d){ return Date.UTC(y,m-1,d,0,0,0,0) - (IRAN_OFFSET_MIN*60*1000); }
    function getIranDayRange(ms){ const {y,m,d}=getTehranYMDParts(ms); const start=tehranMidnightUtcMs(y,m,d); return {start,end:start+DAY_MS}; }

    function startCountdown(){
      if(countdownTimer) clearInterval(countdownTimer);
      const tick = () => {
        const now = Date.now();
        if(!dayStartMs || !dayEndMs || now >= dayEndMs || now < dayStartMs){
          const r = getIranDayRange(now); dayStartMs = r.start; dayEndMs = r.end; midnightRefreshDone = false;
        }
        const total = Math.max(1, dayEndMs - dayStartMs);
        const remain = Math.max(0, dayEndMs - now);
        countdownBarEl.style.width = Math.max(0, Math.min(100, (remain / total) * 100)) + '%';

        if(remain <= 0){
          countdownTextEl.textContent = '۰۰:۰۰:۰۰';
          if(!midnightRefreshDone){ midnightRefreshDone = true; loadRate(); }
          return;
        }

        const hh = Math.floor(remain / 3600000);
        const mm = Math.floor((remain % 3600000) / 60000);
        const ss = Math.floor((remain % 60000) / 1000);
        countdownTextEl.textContent = `${fmt(hh)}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    async function loadConfig(){
      try{
        const res = await fetch('./data/config.json?ts=' + Date.now(), { cache:'no-store' });
        if(!res.ok) throw new Error();
        const cfg = await res.json();
        const v = Number(cfg.fixed_usd || DEFAULT_FIXED_USD);
        fixedUsd = v > 0 ? v : DEFAULT_FIXED_USD;
      }catch{ fixedUsd = DEFAULT_FIXED_USD; }
      usdAmountEl.textContent = fmt(fixedUsd);
    }

    async function loadRate(){
      setLoading(true); hideError();
      try{
        await loadConfig();
        const res = await fetch('./data/rate.json?ts=' + Date.now(), { cache:'no-store' });
        if(!res.ok) throw new Error('خطا در دریافت rate.json');
        const data = await res.json();

        const rate = Number(data.usd_irr || 0);
        if(rate <= 0) throw new Error('نرخ نامعتبر است');

        currentFinalIrr = calcSmartFinal(rate * fixedUsd);
        usdRateEl.textContent = fmt(rate);
        finalAmountEl.textContent = fmt(currentFinalIrr) + ' ریال';
        updatedAtEl.textContent = formatJalaliDate(data.updated_at);
        sourceNameEl.textContent = data.source || 'TGJU';

        // تغییر شماره ۲: زمان‌سنج بر اساس «آخرین بروزرسانی + 24 ساعت»
        const updatedMs = new Date(data.updated_at).getTime();
        if (!Number.isNaN(updatedMs)) {
          dayStartMs = updatedMs;
          dayEndMs = updatedMs + DAY_MS;
          midnightRefreshDone = false;
        } else {
          const r = getIranDayRange(Date.now());
          dayStartMs = r.start; dayEndMs = r.end;
        }
      }catch(err){
        console.error(err);
        showError('دریافت نرخ با مشکل مواجه شد. لطفاً کمی بعد دوباره تلاش کنید.');
        usdRateEl.textContent = '—';
        finalAmountEl.textContent = 'خطا';
        currentFinalIrr = 0;
      }finally{
        setLoading(false);
      }
    }

    function initCardFormat(){ cardNumberEl.textContent = formatCardNumber((cardNumberEl.textContent || '').trim()); }

    copyCardBtnEl.addEventListener('click', copyCardRaw);
    cardTapAreaEl.addEventListener('click', copyCardRaw);

    copyAmountBtnEl.addEventListener('click', async () => {
      if(!currentFinalIrr || currentFinalIrr <= 0) return showError('هنوز مبلغ نهایی آماده نیست.');
      try{
        await navigator.clipboard.writeText(String(currentFinalIrr));
        const old = copyAmountBtnEl.textContent; copyAmountBtnEl.textContent = 'مبلغ کپی شد ✅';
        setTimeout(()=>copyAmountBtnEl.textContent = old, 1200);
      }catch{
        const old = copyAmountBtnEl.textContent; copyAmountBtnEl.textContent = 'کپی نشد ❌';
        setTimeout(()=>copyAmountBtnEl.textContent = old, 1200);
      }
    });

    pngBtnEl.addEventListener('click', () => {
      const w = captureAreaEl.offsetWidth, h = captureAreaEl.offsetHeight;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w*2}" height="${h*2}" viewBox="0 0 ${w} ${h}">
          <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml">${captureAreaEl.outerHTML}</div>
          </foreignObject>
        </svg>`;
      const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = w * 2; c.height = h * 2;
        c.getContext('2d').drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = 'payment-page.png'; // ✅ فیکس نهایی
        a.click();
      };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    });

    initTheme();
    initCardFormat();
    startCountdown();
    loadRate();
  </script>
</body>
</html>
