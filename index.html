<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صفحه پرداخت</title>

  <style>
    /* =========================
       Fonts (Hosted in project)
       Priority: Yekan > Dana > System
       with woff2 + woff fallback
       ========================= */
    @font-face{
      font-family:'Yekan';
      src:
        url('./assets/fonts/Yekan.woff2') format('woff2'),
        url('./assets/fonts/Yekan.woff') format('woff');
      font-display:swap;
      font-weight:100 900;
      font-style:normal;
    }
    @font-face{
      font-family:'Dana';
      src:
        url('./assets/fonts/Dana.woff2') format('woff2'),
        url('./assets/fonts/Dana.woff') format('woff');
      font-display:swap;
      font-weight:100 900;
      font-style:normal;
    }

    :root{
      --font-main:'Yekan','Dana',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial;
      --r-xl:20px; --r-lg:14px; --r-md:10px;
      --tr:.22s ease;
      --danger:#ef4444; --ok:#22c55e;
    }

    html[data-theme="dark"]{
      --bg1:#0a1020; --bg2:#121a2d;
      --text:#e5e7eb; --muted:#94a3b8;
      --card:#0f172acc; --card-b:#3341558c;
      --soft:#11182799; --chip:#111827;
      --btn-text:#052e16; --pay-bg1:#22c55e; --pay-bg2:#4ade80;
      --expired:#374151; --expired-text:#cbd5e1;
      --bar-bg:#3f0b0b; --bar-fill1:#ef4444; --bar-fill2:#f87171;
      --sk:#1f2937;
    }

    html[data-theme="light"]{
      --bg1:#f5f7ff; --bg2:#eef2ff;
      --text:#0f172a; --muted:#475569;
      --card:#ffffffdb; --card-b:#cbd5e1cc;
      --soft:#f8fafc; --chip:#ffffff;
      --btn-text:#052e16; --pay-bg1:#22c55e; --pay-bg2:#4ade80;
      --expired:#cbd5e1; --expired-text:#334155;
      --bar-bg:#fee2e2; --bar-fill1:#ef4444; --bar-fill2:#f87171;
      --sk:#e2e8f0;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font-main);
      color:var(--text);
      background:
        radial-gradient(1000px 600px at 100% -10%, #3b82f61c 0%, transparent 60%),
        radial-gradient(900px 540px at -10% 120%, #8b5cf61a 0%, transparent 60%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      display:flex; align-items:center; justify-content:center;
      padding:18px;
      transition:background var(--tr),color var(--tr);
    }

    button,input,select,textarea{font-family:var(--font-main)}

    .wrap{width:100%;max-width:720px}
    .card{
      background:var(--card);
      border:1px solid var(--card-b);
      border-radius:var(--r-xl);
      backdrop-filter: blur(10px);
      box-shadow:0 20px 60px rgba(2,6,23,.28);
      overflow:hidden;
      animation:fadeIn .35s ease;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(8px)}
      to{opacity:1; transform:translateY(0)}
    }

    .top{
      padding:14px;
      border-bottom:1px solid var(--card-b);
      display:flex; align-items:center; justify-content:space-between; gap:8px;
    }

    .title{
      display:flex; flex-direction:column; gap:4px;
    }
    .title h1{
      margin:0; font-size:20px; font-weight:900; letter-spacing:-.2px;
    }
    .title p{
      margin:0; font-size:12px; color:var(--muted);
    }

    .actions{display:flex; gap:8px}
    .icon-btn{
      border:1px solid var(--card-b);
      background:var(--chip);
      color:var(--text);
      border-radius:10px;
      width:38px;height:38px;
      display:grid;place-items:center;
      cursor:pointer;
      transition:transform .14s ease, background var(--tr), color var(--tr);
    }
    .icon-btn:hover{transform:translateY(-1px)}
    .icon-btn svg{width:18px;height:18px}

    .content{
      padding:16px;
      display:grid;
      gap:12px;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .mini{
      background:var(--soft);
      border:1px solid var(--card-b);
      border-radius:var(--r-lg);
      padding:10px 12px;
    }
    .mini .k{
      font-size:11px; color:var(--muted); margin-bottom:4px;
    }
    .mini .v{
      font-size:22px; font-weight:900; line-height:1.25;
    }
    .mini .u{font-size:11px;color:var(--muted)}

    .final{
      border:1px solid #22c55e66;
      background:linear-gradient(135deg,#052e16,#14532d);
      color:#ecfccb;
      border-radius:var(--r-lg);
      padding:12px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      transition:filter var(--tr), opacity var(--tr);
    }
    .final .k{font-size:12px;color:#bbf7d0}
    .final .v{font-size:30px;font-weight:900}

    .valid{
      border:1px solid #ef444466;
      border-radius:var(--r-md);
      padding:10px;
      background:color-mix(in srgb, var(--bar-bg) 40%, transparent);
    }
    .valid-top{
      display:flex; justify-content:space-between; gap:8px;
      font-size:12px; color:#fecaca; margin-bottom:8px;
    }
    .bar{
      height:8px; border-radius:999px; overflow:hidden;
      background:var(--bar-bg);
      border:1px solid #7f1d1d;
    }
    .bar > span{
      display:block;height:100%;width:100%;
      background:linear-gradient(90deg,var(--bar-fill1),var(--bar-fill2));
      transition:width 1s linear;
    }

    .meta{
      font-size:12px; color:var(--muted);
      display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
      border:1px solid var(--card-b);
      border-radius:var(--r-md);
      padding:10px;
      background:var(--soft);
    }

    .err{
      display:none;
      font-size:12px;
      color:#fecaca;
      background:#7f1d1d2b;
      border:1px solid #ef444466;
      border-radius:10px;
      padding:10px;
    }
    .err.show{display:block}

    .pay{
      width:100%;
      border:none;
      border-radius:12px;
      padding:13px 14px;
      font-size:15px;
      font-weight:900;
      color:var(--btn-text);
      background:linear-gradient(180deg,var(--pay-bg1),var(--pay-bg2));
      box-shadow:0 10px 24px rgba(34,197,94,.30);
      cursor:pointer;
      text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      transition:transform .14s ease, filter .14s ease, opacity var(--tr), background var(--tr), color var(--tr);
    }
    .pay:hover{transform:translateY(-1px)}
    .pay[aria-disabled="true"]{
      pointer-events:none;
      background:var(--expired);
      color:var(--expired-text);
      box-shadow:none;
      opacity:.9;
    }

    .skeleton{
      position:relative;
      color:transparent !important;
      user-select:none;
    }
    .skeleton::after{
      content:"";
      position:absolute; inset:0;
      border-radius:8px;
      background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.08) 35%, transparent 70%), var(--sk);
      background-size:220% 100%, 100% 100%;
      animation:shimmer 1.2s linear infinite;
    }
    @keyframes shimmer{
      from{background-position:220% 0,0 0}
      to{background-position:-20% 0,0 0}
    }

    .footer{
      text-align:center; font-size:11px; color:var(--muted);
      padding-top:2px;
    }

    #confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}

    @media (max-width:640px){
      .row{grid-template-columns:1fr}
      .final .v{font-size:24px}
      .title h1{font-size:18px}
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <main class="wrap">
    <section class="card" id="captureArea">
      <header class="top">
        <div class="title">
          <h1>صفحه پرداخت</h1>
          <p>نمایش خلاصه و شفاف برای پرداخت سریع</p>
        </div>
        <div class="actions">
          <button id="pngBtn" class="icon-btn" type="button" title="دانلود PNG" aria-label="دانلود PNG">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3v11m0 0 4-4m-4 4-4-4M4 17v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="themeToggle" class="icon-btn" type="button" title="تغییر تم" aria-label="تغییر تم">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <section class="row">
          <article class="mini">
            <div class="k">مبلغ سفارش</div>
            <div id="usdAmount" class="v">25</div>
            <div class="u">دلار</div>
          </article>
          <article class="mini">
            <div class="k">نرخ دلار</div>
            <div id="usdRate" class="v skeleton">000000</div>
            <div class="u">تومان</div>
          </article>
        </section>

        <section class="final">
          <div>
            <div class="k">مبلغ نهایی قابل پرداخت</div>
          </div>
          <div id="finalAmount" class="v skeleton">000000</div>
        </section>

        <section class="valid">
          <div class="valid-top">
            <span>اعتبار نرخ</span>
            <span id="countdownText">—</span>
          </div>
          <div class="bar"><span id="countdownBar"></span></div>
        </section>

        <section class="meta">
          <span>بروزرسانی: <strong id="updatedAt">—</strong></span>
          <span>منبع: <strong id="sourceName">TGJU</strong></span>
        </section>

        <div id="errorBox" class="err"></div>

        <a id="payBtn" class="pay" href="https://zarinp.al/YOUR_LINK_HERE" target="_blank" rel="noopener">
          پرداخت با زرین‌پال
        </a>

        <div class="footer">اگر زمان اعتبار تمام شود، پرداخت موقتاً غیرفعال می‌شود.</div>
      </div>
    </section>
  </main>

  <script>
    const FIXED_USD = 25;
    const VALIDITY_MS = 60 * 60 * 1000;

    const usdAmountEl = document.getElementById('usdAmount');
    const usdRateEl = document.getElementById('usdRate');
    const finalAmountEl = document.getElementById('finalAmount');
    const updatedAtEl = document.getElementById('updatedAt');
    const sourceNameEl = document.getElementById('sourceName');
    const countdownTextEl = document.getElementById('countdownText');
    const countdownBarEl = document.getElementById('countdownBar');
    const errorBoxEl = document.getElementById('errorBox');
    const themeToggleEl = document.getElementById('themeToggle');
    const payBtnEl = document.getElementById('payBtn');
    const pngBtnEl = document.getElementById('pngBtn');
    const captureAreaEl = document.getElementById('captureArea');

    const nf = new Intl.NumberFormat('fa-IR');
    const fmt = n => nf.format(Math.floor(n || 0));

    let lastUpdatedMs = null;
    let countdownTimer = null;
    let isExpired = false;

    function applyTheme(theme){
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('theme', theme);
    }

    function initTheme(){
      const saved = localStorage.getItem('theme');
      applyTheme(saved === 'light' || saved === 'dark' ? saved : 'dark');
    }

    themeToggleEl.addEventListener('click', () => {
      const now = document.documentElement.getAttribute('data-theme');
      applyTheme(now === 'dark' ? 'light' : 'dark');
    });

    function showError(msg){
      errorBoxEl.textContent = msg;
      errorBoxEl.classList.add('show');
    }

    function hideError(){
      errorBoxEl.classList.remove('show');
      errorBoxEl.textContent = '';
    }

    function setLoading(on){
      [usdRateEl, finalAmountEl].forEach(el => {
        el.classList.toggle('skeleton', on);
      });
    }

    function setExpiredState(expired){
      isExpired = expired;
      if(expired){
        payBtnEl.setAttribute('aria-disabled','true');
        payBtnEl.textContent = 'اعتبار نرخ تمام شده';
      }else{
        payBtnEl.setAttribute('aria-disabled','false');
        payBtnEl.textContent = 'پرداخت با زرین‌پال';
      }
    }

    function calcSmartFinal(exact){
      return Math.floor(exact / 10000) * 10000 + 900;
    }

    function parseUpdatedAt(str){
      if(!str || typeof str !== 'string') return null;
      const normalized = str.replace(' ', 'T');
      let ms = Date.parse(normalized);
      if(!Number.isNaN(ms)) return ms;
      const noTz = str.replace(/\s[A-Z]{2,5}$/, '');
      ms = Date.parse(noTz.replace(' ','T'));
      return Number.isNaN(ms) ? null : ms;
    }

    function startCountdown(){
      if(countdownTimer) clearInterval(countdownTimer);

      const tick = () => {
        if(!lastUpdatedMs){
          countdownTextEl.textContent = 'نامشخص';
          countdownBarEl.style.width = '100%';
          setExpiredState(false);
          return;
        }

        const now = Date.now();
        const elapsed = now - lastUpdatedMs;
        const remain = Math.max(0, VALIDITY_MS - elapsed);
        const percent = Math.max(0, Math.min(100, (remain / VALIDITY_MS) * 100));
        countdownBarEl.style.width = percent + '%';

        if(remain <= 0){
          countdownTextEl.textContent = 'منقضی شده';
          setExpiredState(true);
          return;
        }

        const mm = Math.floor(remain / 60000);
        const ss = Math.floor((remain % 60000) / 1000);
        countdownTextEl.textContent = `${fmt(mm)}:${String(ss).padStart(2,'0')} دقیقه`;
        setExpiredState(false);
      };

      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    async function loadRate(){
      setLoading(true);
      hideError();
      usdAmountEl.textContent = fmt(FIXED_USD);

      try{
        const res = await fetch('./data/rate.json?ts=' + Date.now(), { cache:'no-store' });
        if(!res.ok) throw new Error('خطا در دریافت rate.json');
        const data = await res.json();

        const rate = Number(data.usd_irr || 0);
        if(rate <= 0) throw new Error('نرخ نامعتبر است');

        const exact = rate * FIXED_USD;
        const final = calcSmartFinal(exact);

        usdRateEl.textContent = fmt(rate);
        finalAmountEl.textContent = fmt(final) + ' تومان';

        updatedAtEl.textContent = data.updated_at || 'نامشخص';
        sourceNameEl.textContent = data.source || 'TGJU';

        lastUpdatedMs = parseUpdatedAt(data.updated_at) || Date.now();
        startCountdown();
      }catch(err){
        console.error(err);
        showError('دریافت نرخ با مشکل مواجه شد. لطفاً کمی بعد دوباره تلاش کنید.');
        usdRateEl.textContent = '—';
        finalAmountEl.textContent = 'خطا';
        updatedAtEl.textContent = 'نامشخص';
        sourceNameEl.textContent = 'TGJU';
        lastUpdatedMs = Date.now();
        startCountdown();
      }finally{
        setLoading(false);
      }
    }

    const confettiCanvas = document.getElementById('confetti');
    const ctx = confettiCanvas.getContext('2d');
    let pieces = [], raf = null;

    function resizeCanvas(){
      confettiCanvas.width = innerWidth;
      confettiCanvas.height = innerHeight;
    }
    addEventListener('resize', resizeCanvas); resizeCanvas();

    function launchConfetti(ms=1400){
      const colors = ['#22c55e','#38bdf8','#f59e0b','#a78bfa','#ef4444'];
      pieces = Array.from({length:140}, () => ({
        x: Math.random()*confettiCanvas.width,
        y: -20 - Math.random()*140,
        w: 5 + Math.random()*5,
        h: 8 + Math.random()*8,
        vx: -1.8 + Math.random()*3.6,
        vy: 2 + Math.random()*3,
        g: 0.05 + Math.random()*0.06,
        r: Math.random()*Math.PI,
        vr: -0.2 + Math.random()*0.4,
        c: colors[Math.floor(Math.random()*colors.length)],
        a: 1
      }));

      const start = performance.now();
      cancelAnimationFrame(raf);

      const frame = t => {
        const e = t - start;
        ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);

        for(const p of pieces){
          p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.a = Math.max(0, 1 - e/ms);
          ctx.save();
          ctx.globalAlpha = p.a;
          ctx.translate(p.x,p.y);
          ctx.rotate(p.r);
          ctx.fillStyle = p.c;
          ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
          ctx.restore();
        }

        if(e < ms) raf = requestAnimationFrame(frame);
        else ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
      };
      raf = requestAnimationFrame(frame);
    }

    payBtnEl.addEventListener('click', (e) => {
      if(isExpired){
        e.preventDefault();
        return;
      }
      launchConfetti();
    });

    pngBtnEl.addEventListener('click', () => {
      const w = captureAreaEl.offsetWidth;
      const h = captureAreaEl.offsetHeight;
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${w*2}" height="${h*2}" viewBox="0 0 ${w} ${h}">
          <foreignObject width="100%" height="100%">
            <div xmlns="http://www.w3.org/1999/xhtml">${captureAreaEl.outerHTML}</div>
          </foreignObject>
        </svg>`;
      const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = w*2; c.height = h*2;
        const x = c.getContext('2d');
        x.drawImage(img,0,0);
        URL.revokeObjectURL(url);
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = 'payment-minimal-ultra.png';
        a.click();
      };
      img.onerror = () => URL.revokeObjectURL(url);
      img.src = url;
    });

    initTheme();
    setExpiredState(false);
    loadRate();
  </script>
</body>
</html>
