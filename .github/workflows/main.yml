name: TGJU Daily Scraper

on:
  schedule:
    # ساعت 20:30 به وقت UTC که دقیقا میشه ساعت 00:00 بامداد به وقت تهران
    - cron: '30 20 * * *'
  workflow_dispatch: # این بهت اجازه میده دستی اجراش کنی هر وقت خواستی

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Packages
        run: pip install -r requirements.txt

      - name: Run Scraper
        run: python update_price.py

      - name: Commit and Push (اگر تغییری بود)
        run: |
          git config --global user.name "Github-Action-Bot"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "🤖 نرخ جدید دلار دریافت شد" || echo "هیچ تغییری در قیمت نسبت به دیروز نبود"
          git push
