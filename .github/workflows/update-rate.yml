name: Update USD Rate (Tehran Midnight)

on:
  schedule:
    # 00:00 Tehran = 20:30 UTC (previous day)
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rate
  cancel-in-progress: false

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: |
          python --version
          python scraper.py

      - name: Validate rate.json shape
        run: |
          test -f data/rate.json
          python - << 'PY'
          import json
          with open('data/rate.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          assert isinstance(data.get('usd_irr'), int) and data['usd_irr'] > 0, "usd_irr invalid"
          assert isinstance(data.get('updated_at'), str) and data['updated_at'].strip(), "updated_at missing"
          assert isinstance(data.get('source'), str) and data['source'].strip(), "source missing"
          print("rate.json OK:", data)
          PY

      - name: Commit and push if changed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/rate.json
          if git diff --cached --quiet; then
            echo "rate.json is unchanged"
            exit 0
          fi

          git commit -m "chore(rate): update daily USD rate"
          git push origin "HEAD:${TARGET_BRANCH}"
