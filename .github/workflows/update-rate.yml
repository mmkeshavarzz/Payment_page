name: Update USD Rate (Tehran Midnight)

on:
  schedule:
    - cron: "30 20 * * *"   # 00:00 Tehran (UTC+3:30)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rate-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated rate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rate.json
          git diff --staged --quiet || git commit -m "chore: update usd rate"
          git push
